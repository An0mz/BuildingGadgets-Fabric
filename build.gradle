plugins {
    id 'fabric-loom' version '1.13-SNAPSHOT'
    id 'maven-publish'
}

group = project.maven_group
version = project.mod_version

repositories {
    maven { name = "ParchmentMC"; url = "https://maven.parchmentmc.org/" }
    maven {
        url = "https://maven.shedaniel.me/"
        content {
            includeGroup "me.shedaniel"
            includeGroup "me.shedaniel.cloth"
            includeGroup "dev.architectury"
        }
    }
    maven {
        name = 'Ladysnake Mods'
        url = 'https://maven.ladysnake.org/releases'
        content {
            includeGroup 'io.github.ladysnake'
            includeGroupByRegex 'org\\.ladysnake.*'
        }
    }
    maven { name = "Curse Maven"; url = "https://cursemaven.com"; content { includeGroup "curse.maven" } }
    maven { name = "Modrinth"; url = "https://api.modrinth.com/maven" }
    maven { url = "https://maven.terraformersmc.com/releases/"; content { includeGroup "com.terraformersmc" } }
    maven { url = "https://maven.jamieswhiteshirt.com/libs-release/"; content { includeGroup 'com.jamieswhiteshirt' } }
    maven { name = "Flemmli97"; url = "https://gitlab.com/api/v4/projects/21830712/packages/maven" }
    maven { url = 'https://jitpack.io' }
    maven { url = "https://maven.saps.dev/minecraft"; content { includeGroup "dev.ftb.mods" } }
    maven { url = "https://maven.nucleoid.xyz/"; name = "Nucleoid" }
    maven { name = "Ladysnake Mods"; url = 'https://maven.ladysnake.org/releases' }
    maven { name = "Lucko"; url = "https://oss.sonatype.org/content/repositories/snapshots/" }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.layered() {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-1.21.5:${project.parchment_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    modImplementation("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }
    modImplementation("com.terraformersmc:modmenu:${project.modmenu_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }

    include modImplementation("teamreborn:energy:${project.energy_version}")

    modRuntimeOnly("dev.architectury:architectury-fabric:${project.architectury_version}")
    modImplementation("me.shedaniel:RoughlyEnoughItems-fabric:${project.rei_version}")

    modImplementation include("com.jamieswhiteshirt:rtree-3i-lite-fabric:${project.rtree_version}")

    modImplementation include("io.github.ladysnake:PlayerAbilityLib:${pal_version}")

    modCompileOnly "curse.maven:IPN-495267:6616909"
    modCompileOnly "curse.maven:ftb-chunks-472657:5415199"
    modCompileOnly "curse.maven:ftb-teams-438497:5202948"
    modCompileOnly "curse.maven:ftb-library-438495:5567592"

    modImplementation include("org.ladysnake.cardinal-components-api:cardinal-components-base:${project.cca_version}")
    modImplementation include("org.ladysnake.cardinal-components-api:cardinal-components-world:${project.cca_version}")
    modImplementation include("org.ladysnake.cardinal-components-api:cardinal-components-level:${project.cca_version}")

    include('me.lucko:fabric-permissions-api:0.3.1')
}

base {}

tasks.named('remapJar') {
    archiveBaseName.set("[${project.findProperty('minecraft_version')}] ${project.findProperty('archives_base_name')}")
    archiveVersion.set(project.findProperty('mod_version'))
    archiveClassifier.set("")
}

tasks.named('remapSourcesJar') {
    archiveBaseName.set("[${project.findProperty('minecraft_version')}] ${project.findProperty('archives_base_name')}")
    archiveVersion.set(project.findProperty('mod_version'))
    archiveClassifier.set("sources")
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

loom {
    accessWidenerPath.set(file("src/main/resources/buildinggadgets.accesswidener"))
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

tasks.withType(AbstractArchiveTask) {
    from(project.file("LICENSE"))
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

processResources {
    inputs.property("version", project.version)
    filesMatching("fabric.mod.json") { expand("version": project.version) }
}

publishing {
    publications {
        mavenJava(MavenPublication) { from components.java }
    }
    repositories {
        maven {
            def releasesRepoUrl = uri("${buildDir}/repos/releases")
            def snapshotsRepoUrl = uri("${buildDir}/repos/snapshots")
            name = "Project"
            url = version.toString().endsWith("SNAPSHOT") ? snapshotsRepoUrl : releasesRepoUrl
        }
    }
}
